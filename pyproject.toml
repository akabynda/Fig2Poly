[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curveforge"
version = "0.1.0"
description = "Synthetic plot and curve segmentation dataset generator"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "Pillow>=10.2"]

[project.scripts]
curveforge = "curveforge.cli:main"

[tool.setuptools.packages.find]
include = ["curveforge*"]

